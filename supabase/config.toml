# Supabase CLI local-dev configuration for the AI Memory app.
# Docs: https://supabase.com/docs/guides/cli/config
# Start the local stack with: supabase start

project_id = "ai-memory"

[api]
# Local API URL will be http://localhost:54321
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[storage]
enabled = true
file_size_limit = "50MiB"
